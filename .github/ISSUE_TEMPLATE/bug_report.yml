name: Bug report
description: Report reproducible behavior that is incorrect or broken.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include private messages, credentials, access tokens, database rows, or encryption backups.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
      placeholder: Include a concise, reproducible description.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open …
        2. Sign in as …
        3. Select …
        4. Observe …
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Cloud mode
        - Demo mode
        - Both
        - Unsure
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Chrome 130, Android 15
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Safe diagnostics
      description: Add screenshots or console errors only after removing sensitive information.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed secrets, private messages, and personal data.
          required: true
        - label: I searched existing issues for duplicates.
          required: true
